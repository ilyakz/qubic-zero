<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qubic Zero</title>
<meta name="description" content="3D and 4D tic-tac-toe against a neural network that taught itself by self-play. Runs right in the browser.">
<style>
:root {
  color-scheme: light;
  --page: #f6f6f3; --surface: #fcfcfb; --raised: #ffffff; --ink: #0b0b0b; --ink2: #52514e; --muted: #6f6d68;
  --border: rgba(11,11,11,.12); --cell: #e9e8e2; --cell-hover: #dad9d1;
  --x: #2a78d6; --o: #eb6834; --x-soft: rgba(42,120,214,.30); --o-soft: rgba(235,104,52,.32);
  --accent: #6250d6; --ring: #0b0b0b; --heat: 42,120,214; --peer: rgba(98,80,214,.55);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --raised: #222221; --ink: #f0efec; --ink2: #c3c2b7; --muted: #9a988f;
    --border: rgba(255,255,255,.13); --cell: #2c2c2a; --cell-hover: #3b3b38;
    --x: #3987e5; --o: #d95926; --x-soft: rgba(57,135,229,.38); --o-soft: rgba(217,89,38,.40);
    --accent: #9085e9; --ring: #f0efec; --heat: 86,152,231; --peer: rgba(144,133,233,.65);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
h1 { font-size: 24px; line-height: 1.2; margin: 0; font-weight: 700; letter-spacing: -.01em; }
.lead { color: var(--ink2); margin: 4px 0 14px; max-width: 760px; }
.lang { background: none; border: 0; color: var(--ink2); font: inherit; font-size: 13.5px; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
.lang:hover { background: var(--cell); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; min-width: 0; }
.field { margin-bottom: 12px; }
.field:last-child { margin-bottom: 0; }
.field > label, .field > .label { display: block; font-size: 12.5px; color: var(--ink2); margin-bottom: 4px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button, .action { font: inherit; font-size: 13.5px; padding: 6px 10px; min-height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--raised); color: var(--ink); cursor: pointer; }
.seg button:hover, .action:hover { background: var(--cell); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.action.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.action.primary:hover { filter: brightness(1.1); background: var(--accent); }
.action:disabled { opacity: .5; cursor: default; }
select { font: inherit; font-size: 13.5px; width: 100%; padding: 6px 8px; min-height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--raised); color: var(--ink); }
.players { display: grid; gap: 8px; }
.check { display: flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink2); cursor: pointer; margin-bottom: 4px; }
.buttons { display: flex; gap: 6px; flex-wrap: wrap; }
.status { font-size: 19px; line-height: 1.3; font-weight: 650; min-height: 1.3em; margin-bottom: 2px; }
.sub { color: var(--ink2); font-size: 13.5px; min-height: 1.5em; }
.gauge { height: 8px; border-radius: 4px; overflow: hidden; background: var(--o); margin: 10px 0 4px; }
.gauge div { height: 100%; background: var(--x); width: 50%; transition: width .4s; }
.gauge-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.progress { height: 3px; border-radius: 2px; background: var(--cell); overflow: hidden; margin-top: 8px; visibility: hidden; }
.progress div { height: 100%; background: var(--accent); width: 0; }
.board-area { overflow-x: auto; padding: 2px; position: relative; --win-color: var(--x); }
/* Выигравшая линия: поверх досок и лучом через куб */
.win-overlay { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 3; overflow: visible; }
.win-overlay path { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw-line .9s ease-out forwards; }
.win-overlay .glow { stroke: var(--win-color); stroke-width: 14; opacity: .35; filter: blur(4px); }
.win-overlay .core { stroke: var(--win-color); stroke-width: 5; }
.win-overlay .shine { stroke: #fff; stroke-width: 1.5; opacity: .95; }
@keyframes draw-line { to { stroke-dashoffset: 0; } }
.cell.won { animation: won-pulse 1.6s ease-in-out .9s infinite; }
@keyframes won-pulse { 50% { filter: brightness(1.28); } }
.boards.finished .cell:not(.won), .cube.finished .cell:not(.won) { opacity: .32; transition: opacity .6s; }
.beam { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; transform-origin: 0 0; pointer-events: none; }
.beam i { position: absolute; left: 0; top: -6px; height: 12px; display: block; transform-origin: 0 50%; }
.beam b { display: block; height: 100%; border-radius: 6px; transform-origin: 0 50%; animation: grow-beam .9s ease-out both;
  background: linear-gradient(90deg, transparent, var(--win-color) 7%, #fff 50%, var(--win-color) 93%, transparent);
  box-shadow: 0 0 16px 4px var(--win-color); }
@keyframes grow-beam { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.cube.finished .cell.won { box-shadow: 0 0 0 3px #fff, 0 0 26px 9px var(--win-color); }
@media (prefers-reduced-motion: reduce) {
  .win-overlay path { animation: none; stroke-dashoffset: 0; }
  .beam b, .cell.won { animation: none; }
}
.boards { display: grid; gap: 14px; }
.layer-title { font-size: 12.5px; color: var(--ink2); margin-bottom: 4px; }
.layer { display: grid; gap: 3px; }
.cell { aspect-ratio: 1; min-width: 0; border: 0; border-radius: 6px; background: var(--cell); color: #fff; font: 700 clamp(12px, 2vw, 22px)/1 system-ui, sans-serif;
  display: flex; align-items: center; justify-content: center; padding: 0; position: relative; }
.cell.free { cursor: pointer; }
.cell.free:hover { background: var(--cell-hover); }
.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 2; }
.cell.x { background: var(--x); }
.cell.o { background: var(--o); }
.cell.x-threat { background: var(--x-soft); }
.cell.o-threat { background: var(--o-soft); }
.cell.both-threat { background: linear-gradient(135deg, var(--x-soft) 50%, var(--o-soft) 50%); }
.cell.peer { box-shadow: inset 0 0 0 2px var(--peer); }
.cell.last { box-shadow: inset 0 0 0 3px var(--ring); }
.cell.won { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ring); z-index: 1; }
.cell .heat { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
.cell .pct { position: relative; font-size: 11px; font-weight: 600; color: var(--ink); pointer-events: none; }
/* Объёмный вид */
.scene { perspective: 1400px; height: min(72vh, 680px); display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; cursor: grab; }
.scene:active { cursor: grabbing; }
.cube { position: relative; transform-style: preserve-3d; }
.cube .slab { position: absolute; inset: 0; transform-style: preserve-3d; }
.cube .layer { width: 100%; height: 100%; padding: 8px; border-radius: 12px; background: rgba(127,127,127,.10); outline: 1px solid var(--border); }
.cube .layer { background: rgba(127,127,127,.06); }
.cube .cell:not(.x):not(.o):not(.x-threat):not(.o-threat):not(.both-threat) { background: rgba(127,127,127,.14); }
.cube .cell.free:hover { background: rgba(127,127,127,.42) !important; }
.cube .cell.x, .cube .cell.o { box-shadow: 0 0 0 1px rgba(0,0,0,.25); font-size: 28px; }
.spread { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); margin-top: 8px; }
.spread input { flex: 1; min-width: 80px; }
#hyper { display: block; width: 100%; touch-action: none; cursor: grab; }
.jog { flex: 1; min-width: 80px; height: 28px; border: 1px solid var(--border); border-radius: 8px; cursor: ew-resize; touch-action: none;
  background: repeating-linear-gradient(90deg, var(--muted) 0 1px, transparent 1px 10px); }
.jog:hover { background-color: var(--cell); }
.jog:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.size-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; width: 100%; }
.size-group span { width: 24px; font-size: 12px; color: var(--muted); }
.boards.flat { margin: 0 auto; }
.boards.dense .layer { gap: 2px; }
.boards.dense .cell { border-radius: 4px; }
.hyper-note { margin: 0 0 2px; color: var(--ink2); font-size: 13.5px; }
.hyper-caption { margin: 0 0 4px; min-height: 1.5em; font-size: 13.5px; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px; font-size: 12.5px; color: var(--ink2); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
details { margin-top: 12px; font-size: 13.5px; color: var(--ink2); }
details summary { cursor: pointer; font-weight: 600; color: var(--ink); }
details p { margin: 6px 0 0; }
.fact { font-size: 13px; color: var(--ink2); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
footer { margin-top: 20px; font-size: 13px; color: var(--muted); }
footer a { color: inherit; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-t="title"></h1>
    <button class="lang" id="lang"></button>
  </header>
  <p class="lead" data-t="lead"></p>
  <div class="layout">
    <div>
      <div class="card">
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div class="sub" id="sub"></div>
        <div class="progress" id="progress"><div></div></div>
      </div>
      <div class="card" style="margin-top:12px">
        <div class="board-area" id="board-area"></div>
        <div class="spread" id="spread-row" hidden>
          <span data-t="spread"></span><input type="range" id="spread" min="40" max="170" value="95" aria-label="spread">
        </div>
        <div class="spread" id="hyper-row" hidden>
          <span data-t="rotate4d"></span><div class="jog" id="jog" role="slider" tabindex="0" aria-label="4D rotation" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0"></div>
          <label class="check" style="margin:0"><input type="checkbox" id="auto4d" checked><span data-t="auto4d"></span></label>
        </div>
        <div class="legend">
          <span><i style="background:var(--x)"></i><span data-t="legendX"></span></span>
          <span><i style="background:var(--o)"></i><span data-t="legendO"></span></span>
          <span><i style="background:var(--x-soft)"></i><span data-t="legendXT"></span></span>
          <span><i style="background:var(--o-soft)"></i><span data-t="legendOT"></span></span>
        </div>
      </div>
    </div>
    <aside class="card">
      <div class="field">
        <div class="label" data-t="board"></div>
        <div class="seg" id="sizes"></div>
      </div>
      <div class="field players">
        <div><label for="px" data-t="crosses"></label><select id="px"></select></div>
        <div><label for="po" data-t="noughts"></label><select id="po"></select></div>
      </div>
      <div class="field">
        <div class="label" data-t="strength"></div>
        <div class="seg" id="levels"></div>
      </div>
      <div class="field">
        <div class="label" data-t="view"></div>
        <div class="seg" id="views"></div>
      </div>
      <div class="field">
        <label class="check"><input type="checkbox" id="hints" checked><span data-t="hints"></span></label>
        <label class="check"><input type="checkbox" id="thoughts" checked><span data-t="thoughts"></span></label>
        <label class="check"><input type="checkbox" id="peers" checked><span data-t="peers"></span></label>
      </div>
      <div class="buttons">
        <button class="action primary" id="new" data-t="newGame"></button>
        <button class="action" id="undo" data-t="undo"></button>
      </div>
      <div class="gauge" id="gauge" title=""><div></div></div>
      <div class="gauge-labels"><span>×</span><span data-t="evaluation"></span><span>○</span></div>
      <div class="fact" id="fact"></div>
      <details>
        <summary data-t="howTitle"></summary>
        <p data-t="how0"></p>
        <p data-t="how1"></p>
        <p data-t="how2"></p>
        <p data-t="how3"></p>
      </details>
    </aside>
  </div>
  <footer><span data-t="footer"></span> <a href="https://github.com/ilyakz/alpha-game2">GitHub</a></footer>
</main>
<script src="engine.js"></script>
<script src="hyper.js"></script>
<script src="app.js"></script>
</body>
</html>
