<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qubic Zero: training</title>
<style>
:root {
  color-scheme: light;
  --page: #f6f6f3; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #6f6d68;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --main: #6250d6; --control: #898781;
  --critical: #d03b3b; --on: #0ca30c; --cell: #eeede8; --track: #e8e7e1; --win: #0b0b0b; --x: #2a78d6; --o: #eb6834;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #9a988f;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --main: #9085e9; --control: #898781;
    --cell: #2c2c2a; --track: #2c2c2a; --win: #f0efec; --x: #3987e5; --o: #d95926;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 24px; line-height: 1.2; margin: 0; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 18px; margin: 30px 0 12px; font-weight: 650; }
h3 { font-size: 14.5px; margin: 0; font-weight: 600; }
.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { font: inherit; font-size: 13.5px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
.seg button:hover { background: var(--track); }
.seg button[aria-pressed="true"] { background: var(--main); border-color: var(--main); color: #fff; font-weight: 600; }
.top-right { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.machine { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 14px; }
.meter { background: var(--page); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.meter-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; color: var(--ink2); }
.meter-head b { font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums; }
.meter .bar { margin: 6px 0 5px; height: 6px; }
.meter .bar div { width: 100%; transition: clip-path .5s; background: linear-gradient(90deg, var(--c3), var(--c4) 60%, var(--critical)); }
.meter .note { font-size: 12.5px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.cores { display: flex; align-items: flex-end; gap: 2px; height: 26px; margin: 6px 0 5px; }
.cores i { flex: 1; min-width: 0; display: flex; align-items: flex-end; height: 100%; background: var(--track); border-radius: 2px; overflow: hidden; }
.cores i span { display: block; width: 100%; height: 100%; transition: clip-path .5s; background: linear-gradient(0deg, var(--c3), var(--c4) 60%, var(--critical)); }
.summary { color: var(--ink2); font-size: 14px; margin: 2px 0 8px; }
#overview tr[data-run], #archive tr[data-run] { cursor: pointer; }
#overview tr[data-run]:hover, #archive tr[data-run]:hover { background: var(--track); }
tr.picked { background: var(--track); box-shadow: inset 3px 0 0 var(--main); }
td .sub { display: block; color: var(--muted); font-size: 12px; }
td.state { white-space: nowrap; }
td.state .dot { margin-right: 6px; }
.badge { display: inline-block; padding: 0 6px; border-radius: 99px; background: var(--main); color: #fff; font-size: 11px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 0 2px; font-size: 13px; color: var(--ink2); }
.chips label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.chips i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; background: var(--axis); }
.c3 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.compare-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.detail-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin: 30px 0 10px; }
.detail-head h2 { margin: 0; }
.detail-head > div { display: flex; gap: 12px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.running { background: var(--on); animation: pulse 2s infinite; }
.dot.crashed { background: var(--critical); }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .dot.running { animation: none; } }
.pill { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; min-width: 0; }
.verdict { font-size: 17px; line-height: 1.45; margin: 0 0 14px; max-width: 980px; }
.progress-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px 24px; margin-top: 14px; }
.label { color: var(--ink2); font-size: 13px; }
.value { font-size: 17px; font-weight: 600; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.steps b { padding: 3px 11px; border-radius: 99px; font-weight: 500; background: var(--track); }
.steps b.active { background: var(--main); color: #fff; font-weight: 600; }
.bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; margin: 10px 0 6px; }
.bar div { height: 100%; background: var(--main); border-radius: 4px; transition: width .6s; }
.stats { display: grid; grid-template-columns: 1.35fr repeat(3, 1fr); gap: 12px; margin-top: 12px; }
.stat .big { font-size: 28px; font-weight: 650; line-height: 1.2; margin-top: 2px; }
.stat.hero .big { font-size: 50px; }
.stat .note { color: var(--ink2); font-size: 13px; margin-top: 4px; }
.charts { display: grid; gap: 12px; }
.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.chart-note { color: var(--ink2); font-size: 13px; margin: 2px 0 8px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink2); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.tip { position: absolute; pointer-events: none; z-index: 5; background: var(--surface); border: 1px solid var(--border);
  box-shadow: 0 4px 16px rgba(0,0,0,.14); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.empty { color: var(--muted); font-size: 13.5px; padding: 26px 0; text-align: center; }
.boards { display: grid; gap: 10px; }
.layer-title { font-size: 12px; color: var(--ink2); margin-bottom: 3px; }
.layer { display: grid; gap: 2px; }
.layer div { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: var(--cell); font-size: 11px; font-variant-numeric: tabular-nums; min-width: 0; }
.layer .x { background: var(--x); color: #fff; font-weight: 700; }
.layer .o { background: var(--o); color: #fff; font-weight: 700; }
.layer .won { box-shadow: 0 0 0 1px var(--surface), 0 0 0 3px var(--win); z-index: 1; position: relative; }
.layer .lastmove { outline: 2px solid var(--win); outline-offset: -2px; }
.game-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 13.5px; color: var(--ink2); flex-wrap: wrap; }
.game-row input { flex: 1; min-width: 140px; }
button.plain { font: inherit; font-size: 13.5px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer; }
button.plain:hover { background: var(--track); }
button.plain:disabled { opacity: .55; cursor: default; }
.scale { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink2); margin-top: 10px; }
.scale i { width: 120px; height: 8px; border-radius: 4px; }
.hint { color: var(--ink2); font-size: 13px; margin-top: 8px; }
.err { color: var(--critical); font-size: 13px; white-space: pre-wrap; margin-top: 10px; max-height: 200px; overflow: auto; }
details summary { cursor: pointer; font-weight: 600; font-size: 14.5px; }
.table-wrap { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { font-weight: 600; color: var(--ink2); }
td.name, th.name { text-align: left; white-space: normal; }
.findings { display: grid; gap: 12px; }
.finding h3 { font-size: 15px; margin-bottom: 4px; }
.finding p { margin: 0 0 8px; font-size: 13.5px; color: var(--ink2); }
@media (max-width: 960px) { .c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stats { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 680px) { .c2, .c4 { grid-template-columns: minmax(0, 1fr); } .stat.hero .big { font-size: 38px; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 data-t="docTitle"></h1>
    <div class="top-right">
      <span class="pill"><span class="dot" id="live-dot"></span><span id="live-text"></span></span>
      <button class="plain" id="lang"></button>
    </div>
  </div>

  <h2 data-t="now"></h2>
  <section class="card">
    <div class="machine" id="machine"></div>
    <div class="summary" id="summary"></div>
    <div class="table-wrap"><table id="overview"></table></div>
    <details id="archive-box" style="margin-top:12px">
      <summary id="archive-title"></summary>
      <div class="table-wrap"><table id="archive"></table></div>
    </details>
  </section>

  <div class="compare-head" style="margin:30px 0 10px">
    <h2 style="margin:0" data-t="compareTitle"></h2>
    <div class="seg" id="compare-range"></div>
  </div>
  <div class="seg" id="compare-boards"></div>
  <div class="chips" id="compare-runs"></div>
  <div class="charts c3" style="margin-top:10px">
    <div class="card"><h3 data-t="cmpTsp"></h3><div class="chart" id="c-cmp-tsp"></div></div>
    <div class="card"><h3 data-t="cmpSecond"></h3><div class="chart" id="c-cmp-second"></div></div>
    <div class="card"><h3 data-t="cmpPure"></h3><div class="chart" id="c-cmp-pure"></div></div>
  </div>
  <div class="card" style="margin-top:12px">
    <h3 data-t="matches"></h3>
    <div class="chart-note" data-t="matchesNote"></div>
    <div class="table-wrap"><table id="matches"></table></div>
  </div>

  <div class="detail-head">
    <h2 id="detail-title"></h2>
    <div>
      <span class="pill" id="pill"><span class="dot" id="pill-dot"></span><span id="pill-text"></span></span>
      <button class="plain" id="stop" hidden data-t="stopRun"></button>
    </div>
  </div>
  <p class="verdict" id="verdict"></p>

  <section class="card">
    <div class="steps" id="steps"></div>
    <div class="bar"><div id="bar" style="width:0"></div></div>
    <div class="label" id="phase-text"></div>
    <div class="progress-grid">
      <div><div class="label" data-t="lIter"></div><div class="value" id="iter">—</div></div>
      <div><div class="label" data-t="lElapsed"></div><div class="value" id="elapsed">—</div></div>
      <div><div class="label" data-t="lIterTime"></div><div class="value" id="iter-time">—</div></div>
      <div><div class="label" id="eta-label"></div><div class="value" id="eta">—</div></div>
      <div><div class="label" data-t="lSpeed"></div><div class="value" id="speed">—</div></div>
      <div id="plateau-box" hidden><div class="label" data-t="lBest"></div><div class="value" id="plateau">—</div></div>
    </div>
    <div class="err" id="error" hidden></div>
    <div class="hint" id="hint" hidden></div>
  </section>

  <section class="stats" id="stats"></section>

  <h2 data-t="strongerTitle"></h2>
  <div class="charts">
    <div class="card">
      <h3 data-t="winsTitle"></h3>
      <div class="chart-note" id="bots-note"></div>
      <div class="chart" id="c-bots"></div>
    </div>
  </div>
  <div class="charts c2" style="margin-top:12px">
    <div class="card">
      <h3 data-t="secondTitle"></h3>
      <div class="chart-note" data-t="secondNote"></div>
      <div class="chart" id="c-second"></div>
    </div>
    <div class="card">
      <h3 data-t="valueTitle"></h3>
      <div class="chart-note" data-t="valueNote"></div>
      <div class="chart" id="c-value"></div>
    </div>
  </div>

  <h2 data-t="trainTitle"></h2>
  <div class="charts c4">
    <div class="card"><h3 data-t="pLoss"></h3><div class="chart-note" data-t="pLossNote"></div><div class="chart" id="c-ploss"></div></div>
    <div class="card"><h3 data-t="vLoss"></h3><div class="chart-note" data-t="vLossNote"></div><div class="chart" id="c-vloss"></div></div>
    <div class="card"><h3 data-t="firstWins"></h3><div class="chart-note" data-t="firstWinsNote"></div><div class="chart" id="c-xwin"></div></div>
    <div class="card"><h3 data-t="gameLen"></h3><div class="chart-note" data-t="gameLenNote"></div><div class="chart" id="c-len"></div></div>
  </div>

  <h2 data-t="playsTitle"></h2>
  <div class="charts c2">
    <div class="card">
      <h3 id="game-title"></h3>
      <div class="game-row">
        <button class="plain" id="g-play">▶</button>
        <input id="g-slider" type="range" min="0" max="0" value="0" aria-label="Move">
        <span id="g-step"></span>
      </div>
      <div class="boards" id="game-board"></div>
      <div class="hint" id="game-note"></div>
    </div>
    <div class="card">
      <h3 data-t="firstMoveTitle"></h3>
      <div class="hint" style="margin:2px 0 10px" data-t="firstMoveHint"></div>
      <div class="boards" id="first-move"></div>
      <div class="scale"><span>0</span><i id="fm-scale"></i><span id="fm-max"></span></div>
      <div class="hint" id="fm-value"></div>
    </div>
  </div>

  <div class="card" style="margin-top:12px">
    <details>
      <summary data-t="allIters"></summary>
      <div class="table-wrap"><table id="table"></table></div>
    </details>
  </div>

  <div class="card" style="margin-top:12px">
    <details id="findings-box">
      <summary data-t="pastExperiments"></summary>
      <div class="findings" id="findings" style="margin-top:10px"></div>
    </details>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);

const TEXT = {
  ru: {
    locale: 'ru', docTitle: 'Qubic Zero: обучение', now: 'Сейчас', archive: 'Остальные запуски', compareTitle: 'Сравнение сетей на одной доске',
    cmpTsp: 'Против бота tsp, %', cmpSecond: 'Против tsp вторым ходом, %', cmpPure: 'Против поиска без сети, %', matches: 'Прямые матчи', matchesNote: 'Сети играют друг с другом. Счёт: победы, ничьи и поражения первой из пары.',
    stopRun: 'Остановить этот запуск', lIter: 'Итерация', lElapsed: 'Идёт уже', lIterTime: 'Одна итерация', lSpeed: 'Симуляций в секунду', lBest: 'Лучшая версия',
    strongerTitle: 'Становится ли сеть сильнее', winsTitle: 'Доля побед над соперниками, %', secondTitle: 'Игра вторым номером, % побед', secondNote: 'Если у первого игрока большое преимущество, настоящая сила видна прежде всего здесь.',
    valueTitle: 'Оценка позиции против простого правила, %', valueNote: 'Правило «всегда ставить на первого» и так угадывает много партий. Сеть понимает позицию, только если её линия заметно выше серой.',
    trainTitle: 'Как идёт обучение', pLoss: 'Ошибка политики', pLossNote: 'Насколько сеть расходится с поиском в выборе хода.', vLoss: 'Ошибка оценки', vLossNote: 'Насколько оценка расходится с исходом партии.',
    firstWins: 'Первый выигрывает, %', firstWinsNote: 'Доля побед первого игрока в партиях сети с собой.', gameLen: 'Длина партии, ходов', gameLenNote: 'Партия обрывается, как только найдена форсированная победа.',

    move: 'Ход', moveOf: (a, b) => `ход ${a} из ${b}`, vsPure: 'поиска без сети', vsBot: b => `бота ${b}`, gameTitle: (i, v) => `Партия итерации ${i} против ${v}`, sideFirst: 'крестиками, ходит первой', sideSecond: 'ноликами, ходит второй',

    firstCheck: 'Идёт первая проверка силы, первые точки на графиках появятся через пару минут.', iterHead: (i, p) => `Итерация ${i}: ${p}.`, secondVsPure: v => ` Вторым ходом против поиска без сети: ${v}%.`,

function setHtml(el, html) { if (el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html; } }
function sortedRuns() {
  const size = r => { const { n, d, k } = shape(r.config); return (4 - d) * 1e4 + n * 100 + k; };  // главная доска, 4D, идёт первой
  return [...overview.runs].sort((a, b) => (isLive(b) - isLive(a)) || (size(a) - size(b)) || a.name.localeCompare(b.name));
}
function drawOverview() {
  const runs = sortedRuns(), current = runs.filter(isCurrent), rest = runs.filter(r => !isCurrent(r));
  const live = runs.filter(r => r.status.state === 'running'), crashed = runs.filter(r => r.status.state === 'crashed');
  let text = live.length ? t.liveCount(live.length) : t.noneLive;
  if (crashed.length) text += t.crashedList(crashed.map(r => r.name).join(', '));
  $('summary').textContent = text + t.summaryTail;
  setHtml($('overview'), overviewHead() + current.map(rowHtml).join(''));
  setHtml($('archive'), overviewHead() + rest.map(rowHtml).join(''));
  $('archive-title').textContent = t.archiveCount(rest.length);
  $('archive-box').hidden = !rest.length;
  drawMachine();
}
// Машина целиком: процессор по потокам, память и видеокарта
function drawMachine() {
  const s = overview.system, g = overview.gpu;
  // Заливка привязана ко всей шкале: высокая нагрузка открывает её красный край
  const meter = (title, share, extra, note) => `<div class="meter"><div class="meter-head"><span>${title}</span><b>${share == null ? '—' : Math.round(share) + '%'}</b></div>${extra || `<div class="bar"><div style="clip-path:inset(0 ${100 - (share || 0)}% 0 0)"></div></div>`}<div class="note">${note}</div></div>`;
  const cores = s ? `<div class="cores">${s.per_core.map((v, i) => `<i title="${t.coreTip(i + 1, Math.round(v))}"><span style="clip-path:inset(${100 - v}% 0 0 0)"></span></i>`).join('')}</div>` : '';
  $('machine').innerHTML =
    meter(t.cpuTitle, s && s.cpu, cores, s ? t.cpuNote(s.cores, s.threads, String(s.load).replace('.', t.locale === 'ru' ? ',' : '.')) : t.noMachine) +
    meter(t.ramTitle, s && 100 * s.ram_used / s.ram_total, '', s ? t.ramNote(s.ram_used, s.ram_total, s.swap_used > 0.05 ? s.swap_used : 0) : t.noMachine) +
    meter(t.gpuTitle, g && g.util, '', g ? t.gpuNote((g.used / 1024).toFixed(1), (g.total / 1024).toFixed(0), g.temp.toFixed(0)) : t.noMachine);
}
function selectRun(name) {
  if (!name || name === selected) return;
  selected = name; lastKey = ''; game = null;
  const url = new URL(location.href);
  url.searchParams.set('run', name);
  history.replaceState(null, '', url);
  const r = overview && overview.runs.find(q => q.name === name);
  if (r) compareBoard = gameName(r.config);
  drawOverview(); drawCompare(); tick();
}
for (const id of ['overview', 'archive']) {
  $(id).addEventListener('click', e => { const tr = e.target.closest('tr[data-run]'); if (tr) selectRun(tr.dataset.run); });
  $(id).addEventListener('keydown', e => { const tr = e.target.closest('tr[data-run]'); if (tr && e.key === 'Enter') selectRun(tr.dataset.run); });
}

/* ---------- сравнение сетей на одной доске ---------- */
function defaultChosen(runs) {
  const set = new Set();
  for (const r of runs.filter(isCurrent).slice(0, MAX_COMPARED)) set.add(r.name);
  return set;
}
function drawCompare() {
  if (!overview) return;
  const runs = sortedRuns();
  const boards = [...new Map(runs.filter(isCurrent).concat(runs).map(r => [gameName(r.config), r])).values()]
    .sort((a, b) => { const x = shape(a.config), y = shape(b.config); return y.d - x.d || x.n - y.n || x.k - y.k; });
  if (!compareBoard || !boards.some(r => gameName(r.config) === compareBoard)) compareBoard = boards.length ? gameName(boards[0].config) : null;
  setHtml($('compare-boards'), boards.map(r => {
    const key = gameName(r.config), live = runs.some(q => gameName(q.config) === key && q.status.state === 'running');
    return `<button data-board="${key}" aria-pressed="${key === compareBoard}">${live ? '<span class="dot running"></span>' : ''}${boardLabel(r.config)}</button>`;
  }).join(''));
  setHtml($('compare-range'), [['equal', t.rangeEqual], ['all', t.rangeAll]].map(([k, label]) => `<button data-range="${k}" aria-pressed="${k === compareRange}">${label}</button>`).join(''));
  const onBoard = runs.filter(r => gameName(r.config) === compareBoard);
  const chosen = chosenRuns[compareBoard] || (chosenRuns[compareBoard] = defaultChosen(onBoard));
  const used = new Set([...chosen].map(n => runColor[n]).filter(Boolean));
  for (const name of chosen) if (!runColor[name]) { runColor[name] = PALETTE.find(c => !used.has(c)); used.add(runColor[name]); }
  setHtml($('compare-runs'), onBoard.map(r => {
    const on = chosen.has(r.name), blocked = !on && chosen.size >= MAX_COMPARED;
    return `<label title="${r.name}"><input type="checkbox" data-run="${r.name}" ${on ? 'checked' : ''} ${blocked ? 'disabled' : ''}><i style="${on ? `background:${runColor[r.name]}` : ''}"></i>${netLabel(r.config)} <span style="color:var(--muted)">${r.name}</span></label>`;
  }).join(''));
  const shown = onBoard.filter(r => chosen.has(r.name));
  const lastIter = r => { const p = lastPoint(r); return p ? p.iter : 0; };
  const live = shown.filter(r => r.status.state === 'running');
  const limit = compareRange === 'all' || !shown.length ? Infinity : live.length ? Math.max(...live.map(lastIter)) : Math.min(...shown.map(lastIter));
  const key = [compareBoard, compareRange, limit, shown.map(r => `${r.name}:${r.points.length}:${runColor[r.name]}`).join()].join('|');
  if (key !== compareKey) {
    compareKey = key;
    const chart = (id, field) => lineChart($(id), {
      series: shown.map(r => ({ name: `${netLabel(r.config)}`, color: runColor[r.name], points: r.points.filter(p => p[field] != null && p.iter <= limit).map(p => ({ x: p.iter, y: p[field] })) })),
      yMin: 0, yMax: 100, unit: '%', height: 230 });
    chart('c-cmp-tsp', 'tsp'); chart('c-cmp-second', 'tsp_second'); chart('c-cmp-pure', 'pure');
  }
  const label = side => { const r = overview.runs.find(q => q.name === side.run); return `${r ? netLabel(r.config) : side.run}<span class="sub">${t.sideIter(side.run, side.iter)}</span>`; };
  const matches = overview.matches.filter(m => m.board === compareBoard).reverse();
  setHtml($('matches'), matches.length
    ? `<tr>${t.matchHead.map((h, i) => `<th${i < 2 ? ' class="name"' : ''}>${h}</th>`).join('')}</tr>` + matches.map(m => `<tr><td class="name">${label(m.a)}</td><td class="name">${label(m.b)}</td><td>${m.win}–${m.draw}–${m.loss}</td><td>${num(100 * (m.win + m.draw / 2) / m.games)}</td><td>${m.as_first.join('–')}</td><td>${m.as_second.join('–')}</td><td>${m.sims}</td></tr>`).join('')
    : `<tr><td class="name" style="border:0;color:var(--muted)">${t.noMatches}</td></tr>`);
}
$('compare-boards').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { compareBoard = b.dataset.board; drawCompare(); } });
$('compare-range').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { compareRange = b.dataset.range; drawCompare(); } });
$('compare-runs').addEventListener('change', e => {
  const name = e.target.dataset.run, chosen = chosenRuns[compareBoard];
  if (e.target.checked) chosen.add(name); else { chosen.delete(name); delete runColor[name]; }
  drawCompare();
});

/* ---------- обновление ---------- */
// Сбой одного блока не должен оставлять на странице данные прошлого запуска в других блоках
function safely(name, fn) {
  try { fn(); } catch (error) { console.error('Блок не отрисован: ' + name, error); }
}
async function loadOverview() {
  try {
    overview = await (await fetch('/api/overview')).json();
    seenAt = Date.now();
  } catch (e) { return; }
  if (!selected && overview.runs.length) {
    const first = sortedRuns()[0];
    selected = first.name;
    compareBoard = gameName(first.config);
  } else if (!compareBoard) {
    const r = overview.runs.find(q => q.name === selected);
    if (r) compareBoard = gameName(r.config);
  }
  safely('общая таблица', drawOverview);
  safely('сравнение', drawCompare);
}
function drawLive() {
  const age = seenAt ? (Date.now() - seenAt) / 1000 : Infinity;
  const fresh = age < 20;
  $('live-dot').className = 'dot ' + (fresh ? 'running' : 'crashed');
  $('live-text').textContent = !seenAt ? t.noServer : fresh ? t.updated(Math.round(age)) : t.stale(fmtDur(age));
}
async function tick() {
  if (!selected) return;
  const asked = selected;
  let state;
  try {
    state = await (await fetch('/api/state?run=' + encodeURIComponent(asked))).json();
  } catch (e) { return; }
  if (asked !== selected) return;
  const run = state.run;
  if (!run) { $('verdict').textContent = t.noRun; return; }
  geo = { n: (run.config && run.config.n) || 4, d: (run.config && run.config.d) || 3 };
  safely('ход обучения', () => progress(state, run));
  const key = selected + ':' + run.metrics.length;
  if (key !== lastKey) {
    lastKey = key;
    lastRun = run;
    safely('итог', () => { $('verdict').textContent = verdict(run); });
    safely('показатели', () => stats(run));
    safely('графики', () => charts(run));
    safely('таблица', () => table(run));
    safely('партия', () => setGame(run.last_game ? { ...run.last_game, run: selected } : null));
    safely('первый ход', () => drawFirstMove(run.first_move));
  }
}
async function loadExperiments() {
  try {
    lastExperiments = await (await fetch('/api/experiments')).json();
    if ($('findings-box').open) drawFindings(lastExperiments);
  } catch (e) { /* покажем при следующем обновлении */ }
}
$('findings-box').addEventListener('toggle', () => { if ($('findings-box').open && lastExperiments) drawFindings(lastExperiments); });
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (lastRun) charts(lastRun);
    compareKey = ''; drawCompare();
    if (lastExperiments && $('findings-box').open) drawFindings(lastExperiments);
  }, 150);
});
$('stop').addEventListener('click', async () => {
  if (!confirm(t.stopConfirm(selected))) return;
  await fetch('/api/stop', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ run: selected }) });
  tick();
});
$('lang').addEventListener('click', () => {
  lang = lang === 'ru' ? 'en' : 'ru';
  t = TEXT[lang];
  try { localStorage.setItem('lang', lang); } catch (e) { /* без сохранения */ }
  applyText();
  lastKey = ''; compareKey = ''; game = null;
  safely('общая таблица', drawOverview);
  safely('сравнение', drawCompare);
  drawLive();
  tick();
  if (lastExperiments && $('findings-box').open) drawFindings(lastExperiments);
});
(async () => {
  applyText();
  await loadOverview();
  await tick();
  loadExperiments();
  setInterval(tick, 3000);
  setInterval(loadOverview, 5000);
  setInterval(drawLive, 1000);
  setInterval(loadExperiments, 120000);
})();
</script>
</body>
</html>
